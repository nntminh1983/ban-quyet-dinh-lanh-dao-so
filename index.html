<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bàn quyết định Lãnh đạo Sở</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Công cụ hỗ trợ lãnh đạo Sở ra quyết định về đầu tư công và xử lý văn bản chồng chéo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
/* Bố cục: thanh điều hướng dọc kiểu sổ công văn bên trái, vùng làm việc bên phải; đỏ son của con dấu là điểm nhấn duy nhất. */
:root {
  --paper: #f2f4f1; --surface: #ffffff; --sunk: #e9ece7; --ink: #17212b; --muted: #5a6573; --line: #d6dbd3;
  --seal: #a3302a; --seal-ink: #ffffff; --seal-soft: #f7e7e4; --steel: #22566b; --steel-soft: #e1edf1;
  --ok: #2b7549; --ok-soft: #e2f1e7; --warn: #9a6210; --warn-soft: #fbf0dc; --crit: #b42318; --crit-soft: #fbe5e2;
  --side: #1d2a35; --side-ink: #d9e1e6; --side-mute: #8fa0ad;
  --f-display: "Source Serif 4", "Noto Serif", Georgia, "Times New Roman", serif;
  --f-body: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11161b; --surface: #182029; --sunk: #0d1216; --ink: #e5e9e4; --muted: #9aa5b1; --line: #2a3540;
  --seal: #e0776b; --seal-ink: #1a0f0d; --seal-soft: #3a2220; --steel: #84b9cc; --steel-soft: #1c303a;
  --ok: #6cc290; --ok-soft: #173023; --warn: #e3ab4f; --warn-soft: #33270f; --crit: #f2786b; --crit-soft: #3a1c19;
  --side: #0c1115; --side-ink: #d9e1e6; --side-mute: #7d8d99; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #11161b; --surface: #182029; --sunk: #0d1216; --ink: #e5e9e4; --muted: #9aa5b1; --line: #2a3540;
  --seal: #e0776b; --seal-ink: #1a0f0d; --seal-soft: #3a2220; --steel: #84b9cc; --steel-soft: #1c303a;
  --ok: #6cc290; --ok-soft: #173023; --warn: #e3ab4f; --warn-soft: #33270f; --crit: #f2786b; --crit-soft: #3a1c19;
  --side: #0c1115; --side-ink: #d9e1e6; --side-mute: #7d8d99; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; line-height: 1.25; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.2rem); }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.08rem; }
h4 { font-size: .98rem; }
p { margin: 0; }
a { color: var(--steel); }
small, .small { font-size: .82rem; }
.muted { color: var(--muted); }
.block { display: block; }
:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--side-ink); padding-block: 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 12px; align-items: center; margin-bottom: 26px; }
.seal { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--seal); color: var(--seal); display: grid; place-items: center; font: 700 .72rem/1 var(--f-display); letter-spacing: .04em; flex: none; position: relative; }
.seal::after { content: ""; position: absolute; inset: 3px; border: 1px solid var(--seal); border-radius: 50%; opacity: .6; }
.brand b { display: block; font: 600 1.02rem/1.25 var(--f-display); color: #fff; }
.brand span { font-size: .76rem; color: var(--side-mute); }
#nav { display: flex; flex-direction: column; gap: 2px; }
#nav a { color: var(--side-ink); text-decoration: none; padding: 9px 12px; border-radius: var(--r); font-size: .9rem; border-left: 3px solid transparent; }
#nav a:hover { background: rgba(255,255,255,.06); }
#nav a.on { background: rgba(255,255,255,.1); border-left-color: var(--seal); color: #fff; font-weight: 600; }
#nav a.key { font-weight: 600; }
.side .foot { margin-top: 26px; font-size: .74rem; color: var(--side-mute); line-height: 1.5; }

main { padding-block: 28px 64px; padding-left: clamp(16px, 3vw, 44px); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; max-width: 1240px; width: 100%; }
main > * { min-width: 0; }

.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--seal); font-weight: 600; }
.hero { display: flex; flex-direction: column; gap: 14px; padding-block: 8px 6px; max-width: 900px; }
.hero h1 { font-size: clamp(1.7rem, 1.2rem + 1.8vw, 2.5rem); }
.lede { font-size: 1.04rem; color: var(--muted); max-width: 68ch; }
.vh { display: flex; flex-direction: column; gap: 8px; }
.vh > p.muted { max-width: 76ch; }
.sec { font-size: 1.18rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.empty, p.empty { color: var(--muted); text-align: center; padding: 26px; }

.btn { font: 500 .88rem/1 var(--f-body); padding: 10px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 7px 10px; font-size: .8rem; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.danger { background: var(--crit); border-color: var(--crit); color: var(--surface); }
.btn.file { position: relative; overflow: hidden; align-self: flex-start; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.pill { display: inline-block; font-size: .74rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.steel { background: var(--steel-soft); color: var(--steel); }
.pill.seal { background: var(--seal-soft); color: var(--seal); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--muted); border-radius: var(--r); padding: 14px 16px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 2px; }
.tile:hover { border-color: var(--muted); }
.tile.ok { border-top-color: var(--ok); } .tile.warn { border-top-color: var(--warn); } .tile.crit { border-top-color: var(--crit); } .tile.steel { border-top-color: var(--steel); }
.tile .lbl { font-size: .78rem; color: var(--muted); font-weight: 500; }
.tile .val { font: 600 2rem/1.15 var(--f-display); font-variant-numeric: tabular-nums; }
.tile .sub { font-size: .78rem; color: var(--muted); }

.three { margin: 0; padding: 0; list-style: none; counter-reset: t; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.three li { counter-increment: t; display: flex; flex-direction: column; gap: 6px; padding-left: 44px; position: relative; }
.three li::before { content: counter(t); position: absolute; left: 0; top: -2px; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--seal); color: var(--seal); display: grid; place-items: center; font: 600 .95rem var(--f-display); }
.three span { color: var(--muted); font-size: .88rem; }
.three a { font-size: .86rem; font-weight: 600; }

.prob { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 6px; position: relative; }
.prob:hover { border-color: var(--seal); }
.prob .n { font: 600 .78rem var(--f-display); color: var(--seal); }
.prob p { font-size: .88rem; color: var(--muted); }
.prob .q { color: var(--ink); font-style: italic; font-family: var(--f-display); font-size: .95rem; }
.prob .go { margin-top: auto; padding-top: 6px; font-size: .84rem; font-weight: 600; color: var(--steel); }
ul.tight, ol.tight { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }

/* biểu mẫu */
.form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.form.f2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form.f3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld.w2 { grid-column: span 2; } .fld.w3 { grid-column: 1 / -1; }
.fld.end { justify-content: flex-end; align-items: flex-start; }
.fld > label { font-size: .78rem; font-weight: 600; color: var(--muted); }
.fld small { color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=search], input:not([type]), select, textarea {
  font: inherit; font-size: .9rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--steel); outline: none; box-shadow: 0 0 0 3px var(--steel-soft); }
input.short { max-width: 120px; }
.chk { display: inline-flex; gap: 8px; align-items: flex-start; font-size: .9rem; cursor: pointer; }
.chk input { margin-top: 4px; accent-color: var(--seal); width: 16px; height: 16px; flex: none; }
.chks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.chks.col { flex-direction: column; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label, .seg button { font: 500 .84rem/1.3 var(--f-body); padding: 7px 12px; border: 1px solid var(--line); border-radius: 99px; cursor: pointer; background: var(--surface); color: var(--ink); }
.seg input:checked + label, .seg button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg input:focus-visible + label { outline: 2px solid var(--seal); outline-offset: 2px; }

/* công cụ quyết định */
.stepper { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.stepper button { font: 500 .88rem var(--f-body); background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; color: var(--muted); cursor: pointer; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.stepper button b { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: .76rem; }
.stepper button.on { color: var(--seal); border-bottom-color: var(--seal); font-weight: 600; }
.nav2 { padding-top: 4px; }
.split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.q { display: flex; flex-direction: column; gap: 8px; padding-block: 10px; border-top: 1px dashed var(--line); }
.q > p { font-weight: 600; font-size: .92rem; }
.out { position: sticky; top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(0,0,0,.25); }
.out h3 { font-size: 1.35rem; }
.k-seal { color: var(--seal); } .k-warn { color: var(--warn); } .k-crit { color: var(--crit); } .k-ok { color: var(--ok); } .k-steel { color: var(--steel); }
.note { font-size: .88rem; padding: 10px 12px; border-radius: 5px; background: var(--sunk); border-left: 3px solid var(--muted); }
.note.ok { background: var(--ok-soft); border-left-color: var(--ok); }
.note.warn { background: var(--warn-soft); border-left-color: var(--warn); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: .88rem; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.prov { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); }
.prov h3 { font-size: 1rem; color: var(--steel); }
.verdict .big { font: 500 1.1rem/1.5 var(--f-display); }
.trace { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.trace li { display: grid; grid-template-columns: 200px 1fr; gap: 14px; padding: 10px 0 10px 16px; border-left: 3px solid var(--line); font-size: .9rem; }
.trace li.ok { border-left-color: var(--ok); } .trace li.warn { border-left-color: var(--warn); } .trace li.stop { border-left-color: var(--crit); }
.trace b { font-weight: 600; }
.wts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.opt { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); }
.opth { display: flex; gap: 8px; } .opth input { font-weight: 600; }
.sc { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.rng { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: .78rem; color: var(--muted); }
.rng span { grid-column: 1 / -1; }
.rng input { accent-color: var(--seal); width: 100%; }
.rng output { font: 600 1rem var(--f-display); color: var(--ink); min-width: 1ch; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(80px, 1.1fr) 44px; gap: 12px; align-items: center; font-size: .88rem; padding-block: 4px; }
.bar .bl { min-width: 0; }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }
.track { display: block; height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--steel); border-radius: 99px; }
.bar.top .track i { background: var(--seal); }
.bar.top .bl { font-weight: 600; }

/* văn bản hành chính */
.paper { font: 15px/1.65 var(--f-display); background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 28px 32px; margin: 0; white-space: pre-wrap; overflow-x: auto; border-radius: 3px; box-shadow: 0 1px 0 var(--line), 0 18px 30px -24px rgba(0,0,0,.35); max-height: 640px; overflow-y: auto; }
.paper.sm { font-size: 14px; padding: 18px 20px; max-height: 360px; }

/* sổ vướng mắc */
.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.pipeline div { padding: 12px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.pipeline div:last-child { border-right: 0; }
.pipeline b { font: 600 1.5rem var(--f-display); }
.pipeline span { font-size: .78rem; color: var(--muted); }
.vm { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--ok); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.vm.warn { border-left-color: var(--warn); } .vm.crit { border-left-color: var(--crit); } .vm.done { border-left-color: var(--line); opacity: .8; }
.vmh { display: flex; gap: 12px; align-items: center; }
.vmh .id { font: 600 .95rem var(--f-display); color: var(--seal); white-space: nowrap; }
.vmh input { font-weight: 600; flex: 1; }

/* bảng */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
thead th { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--sunk); font-weight: 600; white-space: nowrap; }
tbody tr:last-child > * { border-bottom: 0; }
tbody th { font-weight: 600; }
td input, td select { padding: 6px 8px; font-size: .85rem; }
td.c { text-align: center; } td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.load { min-width: 120px; } td.load .track { margin-bottom: 2px; }
tr.hl td { background: var(--ok-soft); }
tr.dim th, tr.dim td { color: var(--muted); }
table.ctl td, table.ctl th { vertical-align: top; min-width: 130px; }
.w4 { width: 70px; } .w5 { width: 90px; } .w6 { width: 96px; } .w10 { width: 150px; } .w12 { width: 170px; } .w14 { width: 210px; } .w16 { width: 240px; }

/* văn bản */
.life { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; counter-reset: s; }
.life button { text-align: left; font: 500 .86rem/1.3 var(--f-body); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; gap: 3px; }
.life button small { font: 600 .74rem var(--f-display); color: var(--seal); }
.life button em { font-style: normal; font-size: .74rem; color: var(--muted); }
.life button.on { border-color: var(--seal); background: var(--seal-soft); }
.chains { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.chain { display: flex; flex-direction: column; gap: 8px; }
.chain h4 { font-size: .92rem; }
.links { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.doc { border: 1px solid var(--line); background: var(--paper); border-radius: 4px; padding: 5px 9px; font: 600 .82rem var(--f-body); display: flex; flex-direction: column; }
.doc small { font-weight: 400; color: var(--muted); font-size: .72rem; }
.arr { color: var(--seal); font-weight: 700; }
.filt input[type=search] { width: 240px; } .filt select { width: auto; }
.grp { margin: 18px 0 10px; font-size: 1rem; color: var(--muted); }
.laws { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.law { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.lh { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.lh b { font: 600 1.02rem var(--f-display); color: var(--seal); }
.law p { font-size: .88rem; }
.law .rel { font-size: .82rem; color: var(--steel); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 4px; }
.tags span { font-size: .7rem; background: var(--sunk); color: var(--muted); padding: 2px 7px; border-radius: 3px; }
.kit { font-size: .88rem; } .kit .loc { color: var(--steel); }

/* lộ trình */
.phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.phase .track i { background: var(--seal); }
.todo { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.todo li { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; font-size: .88rem; }
.todo a { white-space: nowrap; }

.danger { border-color: var(--crit-soft); }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: var(--r); font-size: .88rem; opacity: 0; pointer-events: none; transition: .2s; z-index: 20; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1100px) {
  .wts, .sc { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .life { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split { grid-template-columns: 1fr; } .out { position: static; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
